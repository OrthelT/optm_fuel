name = "optm-fuel-proxy"
main = "worker.js"
compatibility_date = "2026-05-18"
workers_dev = true   # explicit so future deploys don't warn
preview_urls = false # only the canonical workers.dev URL is reachable

# Secrets are NOT defined here — set them with:
#   wrangler secret put PROXY_KEY
#   wrangler secret put FUEL_WEBHOOK_URL
#   wrangler secret put MOON_WEBHOOK_URL
